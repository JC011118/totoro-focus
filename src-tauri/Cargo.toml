[package]
name = "focus-companion"
description = "Offline macOS focus timer with a quiet desktop companion (app shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "focus-companion"

[lib]
name = "focus_companion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
focus-core = { path = "../crates/focus-core" }
tauri = { version = "=2.12.5", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-log = "=2.10.1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
include_dir = "0.7.4"
percent-encoding = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
objc2 = "0.6.5"
block2 = "0.6.2"
# tauri-nspanel enables these crates' default (all-framework) features, so these
# lists document what the shell uses. NSDate gates NSSystemClockDidChangeNotification.
objc2-foundation = { version = "0.3.2", features = ["std", "block2", "NSNotification", "NSString", "NSProcessInfo", "NSData", "NSDate", "NSOperation", "NSObject"] }
objc2-app-kit = { version = "0.3.2", features = ["std", "NSWorkspace", "NSSound", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSPanel", "NSView", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics"] }
